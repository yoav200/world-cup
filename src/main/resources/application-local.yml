server:
  port: 8050

spring:
  application:
    name: world-cup

  datasource:
    url: jdbc:h2:mem:worldcup;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    open-in-view: false

  output:
    ansi:
      enabled: always

  flyway:
    enabled: true
    locations: classpath:db/h2


