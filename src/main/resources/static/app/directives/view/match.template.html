<div class="row g-3">
  <div class="col-lg-4 col-md-6" ng-repeat="match in matches | orderBy: 'kickoff'">
    <div class="card match-card h-100" title="Match number {{match.matchId}}">

      <div class="card-header d-flex justify-content-between align-items-center py-1">
        <small class="text-muted">
          <span class="badge bg-secondary">{{match.matchId}}</span>
          {{match.kickoff | date : 'dd MMM yy, HH:mm'}}
        </small>
        <small><strong>{{match.stageId === 'GROUP_STAGE' ? 'Group ' + match.groupId : match.stageId}}</strong></small>
      </div>

      <div class="card-body py-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="match-team"><team data="match.homeTeam"/></span>
          <strong class="match-score">{{match.result.homeTeamGoals}}</strong>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="match-team"><team data="match.awayTeam"/></span>
          <strong class="match-score">{{match.result.awayTeamGoals}}</strong>
        </div>
      </div>

      <div class="card-footer py-1 text-end" id="match-{{match.matchId}}-link">
        <small><match-links data="match"/></small>
      </div>

    </div>
  </div>
</div>
