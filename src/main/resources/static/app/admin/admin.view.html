<section id="admin" permission="['ROLE_ADMIN']">

    <!-- Header -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-shield-lock me-2"></i>Match Update Panel</h2>
            <p class="text-muted mb-0">Admin only &mdash; enter official match results</p>
        </div>
        <span class="badge bg-danger fs-6"><i class="bi bi-person-gear me-1"></i>Admin</span>
    </div>

    <!-- Match selector card -->
    <div class="card admin-selector-card mb-4">
        <div class="card-header bg-white">
            <h6 class="mb-0"><i class="bi bi-list-ul me-2"></i>Select a Match</h6>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-uppercase text-muted"
                           for="firstStageMatchesList">Group Stage</label>
                    <select id="firstStageMatchesList"
                            class="form-select"
                            ng-options="match as match.label for match in matchesData.firstStage track by match.matchId"
                            ng-model="selected.match"
                            ng-change="onMatchSelected('first')">
                        <option value="">-- Choose a match --</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-uppercase text-muted"
                           for="secondStageMatchesList">Knockout Stage</label>
                    <select id="secondStageMatchesList"
                            class="form-select"
                            ng-options="match as match.label for match in matchesData.secondStage | filter:{ready:true} track by match.matchId"
                            ng-model="selected.match"
                            ng-change="onMatchSelected('second')">
                        <option value="">-- Choose a match --</option>
                    </select>
                </div>
            </div>

            <!-- Qualifiers accordion -->
            <div class="mt-3" ng-show="matchesData.qualifiers">
                <button class="btn btn-sm btn-outline-secondary" type="button"
                        data-bs-toggle="collapse" data-bs-target="#qualifiersCollapse"
                        aria-expanded="false" aria-controls="qualifiersCollapse">
                    <i class="bi bi-diagram-3 me-1"></i>Show Qualifiers
                </button>
                <div class="collapse mt-2" id="qualifiersCollapse">
                    <div class="row g-2">
                        <div class="col-sm-6 col-md-4" ng-repeat="(key, value) in matchesData.qualifiers">
                            <div class="card bg-light">
                                <div class="card-body py-2 px-3">
                                    <h6 class="card-title mb-1 small fw-bold text-uppercase">{{key}}</h6>
                                    <div class="small" ng-repeat="qualifier in value">
                                        <team data="qualifier.team"></team>
                                        <span class="text-muted">({{qualifier.knockoutTeamCode}})</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result form card -->
    <div class="card admin-result-card" ng-if="selected.match">
        <div class="card-header admin-result-header d-flex align-items-center justify-content-between">
            <span><i class="bi bi-pencil-fill me-2"></i>Enter Result &mdash; Match #{{selected.match.matchId}}</span>
            <span class="badge bg-light text-dark" ng-show="selected.match.result">
                <i class="bi bi-check-circle-fill text-success me-1"></i>Result entered
            </span>
        </div>

        <div class="card-body">
            <form data-ng-submit="postResult()">

                <!-- Score input area -->
                <div class="bet-score-row mb-4">
                    <div class="bet-team-side text-end">
                        <team data="selected.match.homeTeam"></team>
                    </div>
                    <div class="bet-score-inputs">
                        <input type="number" min="0" max="20"
                               class="form-control form-control-lg bet-score-input"
                               placeholder="-"
                               ng-model="matchResult.homeTeamGoals"
                               ng-change="onGoalsChanged()">
                        <span class="bet-score-separator">:</span>
                        <input type="number" min="0" max="20"
                               class="form-control form-control-lg bet-score-input"
                               placeholder="-"
                               ng-model="matchResult.awayTeamGoals"
                               ng-change="onGoalsChanged()">
                    </div>
                    <div class="bet-team-side text-start">
                        <team data="selected.match.awayTeam"></team>
                    </div>
                </div>

                <!-- Match qualifier -->
                <div class="row mb-4">
                    <div class="col-md-6 mx-auto">
                        <label class="form-label fw-semibold small text-uppercase text-muted"
                               for="matchQualifier">
                            <i class="bi bi-arrow-right-circle me-1"></i>Match Qualifier (winner)
                        </label>
                        <select id="matchQualifier" class="form-select"
                                ng-model="matchResult.matchQualifier"
                                ng-options="x for x in options.matchQualifier">
                            <option value="">-- Draw / Not set --</option>
                        </select>
                        <div class="form-text">Auto-set from score. Override for knockout draws (penalties).</div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg px-5">
                        <i class="bi bi-check-lg me-1"></i>Save Result
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Empty state -->
    <div class="text-center text-muted py-5" ng-if="!selected.match">
        <i class="bi bi-hand-index-thumb" style="font-size: 2.5rem;"></i>
        <p class="mt-2">Select a match above to enter its result</p>
    </div>

</section>
